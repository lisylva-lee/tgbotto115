# ruff 配置：CI 跑 ruff check .
#
# 门禁只纳入"确实是问题且能稳定通过"的规则：E/W(基础错误) F(未定义/未用) I(导入顺序)
# UP(过时写法)。
#
# 刻意不纳入的规则（不是不管，而是需要逐处判断语义，见审查记录）：
#   BLE001 盲捕获 except Exception —— 核心网络层大量使用防御式捕获（115 接口返回结构
#          不稳定），改成精确异常会改变降级行为，需要逐点评估后再收；
#   W293   空行带空格（32 处，纯整洁度，改动会淹没真正的 diff）；
#   S102   测试里用 exec 构造用例；RUF022 __all__ 未排序（顺序有阅读意图）；
#   DTZ005/PYI034/TRY002/SIM103/S112/RUF059 —— 风格类，暂不阻塞。
target-version = "py313"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # 行宽由 line-length 提示，不阻塞
    "W293",   # 空行带空格
]
